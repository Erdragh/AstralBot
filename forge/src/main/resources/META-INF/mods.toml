modLoader = "kotlinforforge"
loaderVersion = "[4.6,)"
license = "${license}"
issueTrackerURL = "https://github.com/Erdragh/AstralBot/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/mod/astralbot"
logoFile = "icon.png"
authors = "${credits}"
description = "${description}"

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"